<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShreeWin Pro - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 pb-20">

    <div class="max-w-md mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold text-purple-400">🛠️ Admin Dashboard</h2>
            <a href="index.html" class="bg-slate-700 px-3 py-1 rounded text-xs">Back to Portal</a>
        </div>

        <!-- Daily Income Tracker -->
        <div class="glass p-4 rounded-xl bg-gradient-to-r from-purple-900 to-indigo-900">
            <p class="text-xs text-slate-300">Total Daily Income (Revenue)</p>
            <h3 id="adminDailyIncome" class="text-2xl font-bold text-emerald-400">₹0.00</h3>
        </div>

        <!-- Customer Support Toggle Switch -->
        <div class="glass p-4 rounded-xl flex justify-between items-center">
            <div>
                <h4 class="font-bold text-sm">Customer Service Status</h4>
                <p class="text-xs text-slate-400">Turn support on/off for users</p>
            </div>
            <button id="supportToggleBtn" onclick="toggleSupportStatus()" class="px-4 py-2 rounded font-bold text-xs bg-emerald-600">ONLINE</button>
        </div>

        <!-- Admin Management (Add/Remove Admins) -->
        <div class="glass p-4 rounded-xl space-y-3">
            <h4 class="font-bold text-sm text-yellow-400">👥 Admin Management</h4>
            <div class="flex space-x-2">
                <input type="text" id="newAdminUser" class="w-full bg-slate-800 p-2 rounded text-sm text-white" placeholder="New Admin Username">
                <button onclick="addNewAdmin()" class="bg-emerald-600 px-4 py-2 rounded text-sm font-bold">Add</button>
            </div>
            <div id="adminList" class="text-xs space-y-1 text-slate-300"></div>
        </div>

        <!-- User Balance Control (Add / Deduct) -->
        <div class="glass p-4 rounded-xl space-y-3">
            <h4 class="font-bold text-sm text-cyan-400">💰 User Balance Control</h4>
            <input type="text" id="targetUserUid" class="w-full bg-slate-800 p-2 rounded text-sm text-white" placeholder="User UID">
            <input type="number" id="targetBalanceAmount" class="w-full bg-slate-800 p-2 rounded text-sm text-white" placeholder="Amount (e.g. 500 or -200)">
            <div class="flex space-x-2">
                <button onclick="modifyUserBalance('add')" class="w-1/2 bg-emerald-600 py-2 rounded text-sm font-bold">Add Balance</button>
                <button onclick="modifyUserBalance('deduct')" class="w-1/2 bg-red-600 py-2 rounded text-sm font-bold">Deduct Balance</button>
            </div>
        </div>

        <!-- Pending Requests -->
        <div class="glass p-4 rounded-xl space-y-3">
            <h4 class="font-bold text-sm">📋 Transaction Requests</h4>
            <div id="adminRequestsList" class="text-xs space-y-2 text-slate-300">No pending requests</div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadAdminData();
        });
    </script>
</body>
</html>
